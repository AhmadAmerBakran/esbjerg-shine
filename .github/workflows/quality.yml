name: Website quality gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esbjerg-shine-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/site-hero.js
          node --check public/site-deferred.js
          node --check functions/api/contact.js

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk

      - name: Enforce public asset budgets
        run: |
          oversized="$(find public -type f ! -path 'public/media/video/*' -size +1200k -print)"
          if [ -n "$oversized" ]; then
            echo "Non-video public files above 1.2 MB are not allowed:"
            echo "$oversized"
            exit 1
          fi

          if [ -d public/media/video ]; then
            oversized_video="$(find public/media/video -type f -size +4096k -print)"
            if [ -n "$oversized_video" ]; then
              echo "Video files above 4 MB are not allowed:"
              echo "$oversized_video"
              exit 1
            fi
          fi

      - name: Verify SEO outputs
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q 'lang="da-DK"' dist/index.html
          grep -q 'Bilpleje i Esbjerg' dist/index.html
          grep -q 'AutomotiveBusiness\|AutoWash\|LocalBusiness' dist/index.html
          grep -q 'sitemap.xml' dist/robots.txt

      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/esbjerg-shine-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/esbjerg-shine-http.log
          exit 1

      - name: Lighthouse mobile
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --output=json \
              --output-path="lighthouse-mobile-${i}.json"
          done

      - name: Lighthouse desktop
        run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-desktop.json

      - name: Enforce Lighthouse floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const thresholds = { performance: .95, accessibility: .98, 'best-practices': .95, seo: 1 };
          const diagnostics = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'total-byte-weight'
          ];
          const mobileFiles = ['lighthouse-mobile-1.json', 'lighthouse-mobile-2.json', 'lighthouse-mobile-3.json'];
          const mobileReports = mobileFiles.map((file) => ({ file, report: JSON.parse(fs.readFileSync(file, 'utf8')) }));

          for (const { file, report } of mobileReports) {
            const performance = report.categories?.performance?.score ?? 0;
            console.log(`${file} performance: ${Math.round(performance * 100)}`);
            for (const id of diagnostics) {
              const audit = report.audits?.[id];
              if (audit) console.log(`${file} ${id}: ${audit.displayValue ?? audit.numericValue ?? 'n/a'}`);
            }
          }

          const mobileScores = mobileReports
            .map(({ report }) => report.categories?.performance?.score ?? 0)
            .sort((a, b) => a - b);
          const mobileMedian = mobileScores[1];
          const mobileMinimum = mobileScores[0];
          console.log(`mobile performance median: ${Math.round(mobileMedian * 100)} / minimum ${Math.round(thresholds.performance * 100)}`);
          console.log(`mobile performance lowest run: ${Math.round(mobileMinimum * 100)} / safety floor 90`);
          if (mobileMedian < thresholds.performance || mobileMinimum < .90) process.exitCode = 1;

          const representativeMobile = mobileReports[1].report;
          for (const [name, minimum] of Object.entries(thresholds)) {
            if (name === 'performance') continue;
            const scores = mobileReports.map(({ report }) => report.categories?.[name]?.score ?? 0);
            const score = Math.min(...scores);
            console.log(`mobile ${name}: ${Math.round(score * 100)} / minimum ${Math.round(minimum * 100)}`);
            if (score < minimum) process.exitCode = 1;
          }

          const mainThread = representativeMobile.audits?.['mainthread-work-breakdown']?.details?.items ?? [];
          console.log('mobile main-thread breakdown:', JSON.stringify(mainThread.slice(0, 10)));
          const bootup = representativeMobile.audits?.['bootup-time']?.details?.items ?? [];
          console.log('mobile script bootup:', JSON.stringify(bootup.slice(0, 10)));
          const longTasks = representativeMobile.audits?.['long-tasks']?.details?.items ?? [];
          console.log('mobile long tasks:', JSON.stringify(longTasks.slice(0, 10)));

          const desktop = JSON.parse(fs.readFileSync('lighthouse-desktop.json', 'utf8'));
          for (const [name, minimum] of Object.entries(thresholds)) {
            const score = desktop.categories?.[name]?.score ?? 0;
            console.log(`lighthouse-desktop.json ${name}: ${Math.round(score * 100)} / minimum ${Math.round(minimum * 100)}`);
            if (score < minimum) process.exitCode = 1;
          }
          for (const id of diagnostics) {
            const audit = desktop.audits?.[id];
            if (audit) console.log(`lighthouse-desktop.json ${id}: ${audit.displayValue ?? audit.numericValue ?? 'n/a'}`);
          }
          NODE

      - name: Upload Lighthouse reports
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: lighthouse-*.json
          retention-days: 14
