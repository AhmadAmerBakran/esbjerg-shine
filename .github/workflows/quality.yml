name: Website quality gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esbjerg-shine-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log
          if grep -Eq 'npm warn (deprecated|install-scripts)' /tmp/npm-ci.log; then
            echo 'Deprecated dependency or unreviewed dependency install script detected.'
            exit 1
          fi

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: Astro type check
        run: npm run check

      - name: Lint JavaScript
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/site-hero.js
          node --check public/site-deferred.js
          node --check functions/api/contact.js
          node --check worker/index.js

      - name: Verify production Turnstile config
        if: github.ref == 'refs/heads/master'
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: test -n "$PUBLIC_TURNSTILE_SITE_KEY"

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Validate Cloudflare bundle
        run: npm run cf:dry-run

      - name: Enforce public asset budgets
        run: |
          oversized="$(find public -type f ! -path 'public/media/video/*' -size +1200k -print)"
          if [ -n "$oversized" ]; then
            echo "Non-video public files above 1.2 MB are not allowed:"
            echo "$oversized"
            exit 1
          fi

          if [ -d public/media/video ]; then
            oversized_video="$(find public/media/video -type f -size +4096k -print)"
            if [ -n "$oversized_video" ]; then
              echo "Video files above 4 MB are not allowed:"
              echo "$oversized_video"
              exit 1
            fi
          fi

      - name: Verify SEO outputs
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml

          grep -q 'lang="da-DK"' dist/index.html
          grep -q 'Bilpleje i Esbjerg' dist/index.html
          grep -q 'AutomotiveBusiness\|AutoWash\|LocalBusiness' dist/index.html
          grep -q 'rel="canonical" href="https://esbjergshine.dk/"' dist/index.html
          grep -q 'og:image:type' dist/index.html
          grep -q 'twitter:title' dist/index.html
          ! grep -q 'hreflang=' dist/index.html

          grep -q 'rel="canonical" href="https://esbjergshine.dk/ydelser/polering/"' dist/ydelser/polering/index.html
          grep -q '"@type":"Service"' dist/ydelser/polering/index.html
          grep -q '"@type":"BreadcrumbList"' dist/ydelser/polering/index.html
          grep -q '"@type":"BreadcrumbList"' dist/ydelser/index.html
          grep -q '"@type":"ItemList"' dist/ydelser/index.html

          grep -q '<lastmod>2026-09-27</lastmod>' dist/sitemap.xml
          ! grep -q '/404/' dist/sitemap.xml
          grep -q 'sitemap.xml' dist/robots.txt

          grep -q 'noindex,nofollow' dist/404.html
          ! grep -q 'rel="canonical"' dist/404.html
          ! grep -q 'application/ld+json' dist/404.html

      - name: Verify accessibility outputs
        run: |
          grep -q 'class="skip-link"' dist/index.html
          grep -q 'aria-controls="hovednavigation"' dist/index.html
          grep -q 'aria-describedby="contact-form-help contact-form-status"' dist/index.html
          grep -q 'aria-valuetext="52 procent før og 48 procent efter"' dist/index.html
          grep -q 'aria-live="polite"' dist/index.html
          grep -Rqs 'prefers-reduced-motion:reduce' dist/_astro
          grep -q 'Siden findes' dist/404.html
          grep -q '"not_found_handling": "404-page"' wrangler.jsonc

      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/esbjerg-shine-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/esbjerg-shine-http.log
          exit 1

      - name: Lighthouse mobile
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --output=json \
              --output-path="lighthouse-mobile-${i}.json"
          done

      - name: Lighthouse desktop
        run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-desktop.json

      - name: Enforce Lighthouse floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const thresholds = { performance: .95, accessibility: 1, 'best-practices': .95, seo: 1 };
          const diagnostics = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'total-byte-weight'
          ];
          const mobileFiles = ['lighthouse-mobile-1.json', 'lighthouse-mobile-2.json', 'lighthouse-mobile-3.json'];
          const mobileReports = mobileFiles.map((file) => ({ file, report: JSON.parse(fs.readFileSync(file, 'utf8')) }));

          for (const { file, report } of mobileReports) {
            const performance = report.categories?.performance?.score ?? 0;
            console.log(`${file} performance: ${Math.round(performance * 100)}`);
            for (const id of diagnostics) {
              const audit = report.audits?.[id];
              if (audit) console.log(`${file} ${id}: ${audit.displayValue ?? audit.numericValue ?? 'n/a'}`);
            }
          }

          const rankedMobile = mobileReports
            .map((entry) => ({ ...entry, performance: entry.report.categories?.performance?.score ?? 0 }))
            .sort((a, b) => a.performance - b.performance);
          const representativeMobile = rankedMobile[1];
          console.log(`mobile performance median: ${Math.round(representativeMobile.performance * 100)} / minimum ${Math.round(thresholds.performance * 100)}`);
          if (representativeMobile.performance < thresholds.performance) process.exitCode = 1;

          for (const [name, minimum] of Object.entries(thresholds)) {
            if (name === 'performance') continue;
            const scores = mobileReports.map(({ report }) => report.categories?.[name]?.score ?? 0);
            const score = Math.min(...scores);
            console.log(`mobile ${name}: ${Math.round(score * 100)} / minimum ${Math.round(minimum * 100)}`);
            if (score < minimum) process.exitCode = 1;
          }

          const mainThread = representativeMobile.report.audits?.['mainthread-work-breakdown']?.details?.items ?? [];
          console.log('mobile main-thread breakdown:', JSON.stringify(mainThread.slice(0, 10)));
          const bootup = representativeMobile.report.audits?.['bootup-time']?.details?.items ?? [];
          console.log('mobile script bootup:', JSON.stringify(bootup.slice(0, 10)));
          const longTasks = representativeMobile.report.audits?.['long-tasks']?.details?.items ?? [];
          console.log('mobile long tasks:', JSON.stringify(longTasks.slice(0, 10)));

          const desktop = JSON.parse(fs.readFileSync('lighthouse-desktop.json', 'utf8'));
          for (const [name, minimum] of Object.entries(thresholds)) {
            const score = desktop.categories?.[name]?.score ?? 0;
            console.log(`lighthouse-desktop.json ${name}: ${Math.round(score * 100)} / minimum ${Math.round(minimum * 100)}`);
            if (score < minimum) process.exitCode = 1;
          }
          for (const id of diagnostics) {
            const audit = desktop.audits?.[id];
            if (audit) console.log(`lighthouse-desktop.json ${id}: ${audit.displayValue ?? audit.numericValue ?? 'n/a'}`);
          }
          NODE

      - name: Upload Lighthouse reports
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: lighthouse-*.json
          retention-days: 14
