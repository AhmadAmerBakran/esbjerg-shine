name: Website quality gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esbjerg-shine-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=low

      - name: JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/site-hero.js
          node --check public/site-deferred.js
          node --check functions/api/contact.js
          node --check scripts/optimize-dist-media.mjs
          node --check scripts/test-contact.mjs

      - name: Contact endpoint regression tests
        run: npm run test:contact

      - name: Build production site
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk

      - name: Enforce deployment asset budgets
        run: |
          oversized="$(find dist/media -type f ! -path 'dist/media/video/*' -size +600k -print)"
          if [ -n "$oversized" ]; then
            echo "Production non-video media above 600 KB are not allowed:"
            echo "$oversized"
            exit 1
          fi

          if [ -d dist/media/video ]; then
            oversized_video="$(find dist/media/video -type f -size +4096k -print)"
            if [ -n "$oversized_video" ]; then
              echo "Production video files above 4 MB are not allowed:"
              echo "$oversized_video"
              exit 1
            fi
          fi

      - name: Verify deployment and SEO outputs
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/_headers
          test -f dist/_routes.json
          test -f dist/media/home/hero-background-mobile.webp
          grep -q 'lang="da-DK"' dist/index.html
          grep -q 'Bilpleje i Esbjerg' dist/index.html
          grep -q 'AutomotiveBusiness' dist/index.html
          grep -q 'hero-background-mobile.webp 1200w' dist/index.html
          grep -q 'fetchpriority="high"' dist/index.html
          grep -q 'sitemap.xml' dist/robots.txt
          grep -q 'Disallow: /api/' dist/robots.txt
          grep -q 'https://esbjergshine.dk/ydelser/polering/' dist/sitemap.xml
          grep -q 'Content-Security-Policy:' dist/_headers
          grep -q 'Strict-Transport-Security:' dist/_headers
          if grep -Rni --exclude='*.map' 'lakforbedring' dist; then
            echo 'Obsolete lakforbedring copy found in production output.'
            exit 1
          fi

      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/esbjerg-shine-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/esbjerg-shine-http.log
          exit 1

      - name: Lighthouse mobile
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
              --quiet \
              --chrome-flags="--headless --no-sandbox" \
              --output=json \
              --output-path="lighthouse-mobile-${i}.json"
          done

      - name: Lighthouse desktop
        run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-desktop.json

      - name: Enforce Lighthouse floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const thresholds = { performance: .95, accessibility: .98, 'best-practices': .95, seo: 1 };
          const diagnostics = [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'total-byte-weight'
          ];
          const detailAudits = [
            'largest-contentful-paint-element',
            'lcp-breakdown-insight',
            'lcp-discovery-insight',
            'cls-culprits-insight',
            'layout-shift-elements'
          ];
          const mobileFiles = ['lighthouse-mobile-1.json', 'lighthouse-mobile-2.json', 'lighthouse-mobile-3.json'];
          const mobileReports = mobileFiles.map((file) => ({ file, report: JSON.parse(fs.readFileSync(file, 'utf8')) }));

          for (const { file, report } of mobileReports) {
            const performance = report.categories?.performance?.score ?? 0;
            console.log(`${file} performance: ${Math.round(performance * 100)}`);
            for (const id of diagnostics) {
              const audit = report.audits?.[id];
              if (audit) console.log(`${file} ${id}: ${audit.displayValue ?? audit.numericValue ?? 'n/a'}`);
            }
            for (const id of detailAudits) {
              const audit = report.audits?.[id];
              if (audit?.details) console.log(`${file} ${id}: ${JSON.stringify(audit.details).slice(0, 12000)}`);
            }
          }

          const rankedMobile = mobileReports
            .map((entry) => ({ ...entry, performance: entry.report.categories?.performance?.score ?? 0 }))
            .sort((a, b) => a.performance - b.performance);
          const representativeMobile = rankedMobile[1];
          console.log(`mobile performance median: ${Math.round(representativeMobile.performance * 100)} / minimum ${Math.round(thresholds.performance * 100)}`);
          if (representativeMobile.performance < thresholds.performance) process.exitCode = 1;

          for (const [name, minimum] of Object.entries(thresholds)) {
            if (name === 'performance') continue;
            const scores = mobileReports.map(({ report }) => report.categories?.[name]?.score ?? 0);
            const score = Math.min(...scores);
            console.log(`mobile ${name}: ${Math.round(score * 100)} / minimum ${Math.round(minimum * 100)}`);
            if (score < minimum) process.exitCode = 1;
          }

          const mainThread = representativeMobile.report.audits?.['mainthread-work-breakdown']?.details?.items ?? [];
          console.log('mobile main-thread breakdown:', JSON.stringify(mainThread.slice(0, 10)));
          const bootup = representativeMobile.report.audits?.['bootup-time']?.details?.items ?? [];
          console.log('mobile script bootup:', JSON.stringify(bootup.slice(0, 10)));
          const longTasks = representativeMobile.report.audits?.['long-tasks']?.details?.items ?? [];
          console.log('mobile long tasks:', JSON.stringify(longTasks.slice(0, 10)));

          const desktop = JSON.parse(fs.readFileSync('lighthouse-desktop.json', 'utf8'));
          for (const [name, minimum] of Object.entries(thresholds)) {
            const score = desktop.categories?.[name]?.score ?? 0;
            console.log(`lighthouse-desktop.json ${name}: ${Math.round(score * 100)} / minimum ${Math.round(minimum * 100)}`);
            if (score < minimum) process.exitCode = 1;
          }
          for (const id of diagnostics) {
            const audit = desktop.audits?.[id];
            if (audit) console.log(`lighthouse-desktop.json ${id}: ${audit.displayValue ?? audit.numericValue ?? 'n/a'}`);
          }
          NODE

      - name: Upload Lighthouse reports
        if: always() && (failure() || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: lighthouse-reports
          path: lighthouse-*.json
          retention-days: 14
