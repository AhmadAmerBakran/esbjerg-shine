name: Task 10 contact validation

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit
        run: npm audit --audit-level=low

      - name: Astro check
        run: npm run check

      - name: JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/site-deferred.js
          node --check public/site-hero.js
          node --check functions/api/contact.js
          node --check worker/index.js

      - name: Contact backend contract
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { onRequestPost } from './functions/api/contact.js';

          const cacheStore = new Map();
          globalThis.caches = {
            default: {
              async match(request) {
                const response = cacheStore.get(request.url);
                return response ? response.clone() : undefined;
              },
              async put(request, response) {
                cacheStore.set(request.url, response.clone());
              }
            }
          };

          let graphSends = 0;
          let graphShouldFail = false;
          globalThis.fetch = async (input) => {
            const url = String(input);
            if (url.includes('challenges.cloudflare.com')) {
              return Response.json({ success: true, action: 'contact', hostname: 'esbjergshine.dk' });
            }
            if (url.includes('login.microsoftonline.com')) {
              return Response.json({ access_token: 'test-token', expires_in: 3600 });
            }
            if (url.includes('graph.microsoft.com')) {
              graphSends += 1;
              return new Response(null, { status: graphShouldFail ? 503 : 202 });
            }
            throw new Error(`Unexpected fetch: ${url}`);
          };

          const env = {
            APP_ENV: 'production',
            APP_HOSTNAME: 'esbjergshine.dk',
            TURNSTILE_SECRET_KEY: 'test-secret',
            M365_TENANT_ID: 'tenant',
            M365_CLIENT_ID: 'client',
            M365_CLIENT_SECRET: 'secret',
            CONTACT_MAILBOX: 'info@esbjergshine.dk',
            CONTACT_TO: 'info@esbjergshine.dk',
            CONTACT_RATE_LIMITER: { limit: async () => ({ success: true }) }
          };

          const basePayload = {
            navn: 'Test Kunde',
            telefon: '+45 12345678',
            email: 'kunde@example.com',
            ydelse: 'Polering',
            besked: 'Test af kontaktformular.',
            website: '',
            turnstileToken: 'turnstile-test',
            submissionId: '11111111-1111-4111-8111-111111111111',
            startedAt: Date.now() - 2000,
            samtykke: true
          };

          const makeContext = (payload) => ({
            request: new Request('https://esbjergshine.dk/api/contact', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Origin: 'https://esbjergshine.dk',
                'Sec-Fetch-Site': 'same-origin',
                'CF-Connecting-IP': '203.0.113.10'
              },
              body: JSON.stringify(payload)
            }),
            env,
            waitUntil() {}
          });

          const first = await onRequestPost(makeContext(basePayload));
          assert.equal(first.status, 200);
          assert.equal((await first.json()).ok, true);
          assert.match(first.headers.get('X-Request-ID') || '', /^[0-9a-f-]{36}$/i);
          assert.equal(graphSends, 1);

          const duplicate = await onRequestPost(makeContext(basePayload));
          assert.equal(duplicate.status, 200);
          assert.deepEqual(await duplicate.json(), { ok: true, duplicate: true });
          assert.equal(graphSends, 1, 'duplicate submission must not send a second Graph email');

          graphShouldFail = true;
          const failedPayload = {
            ...basePayload,
            besked: 'Ny test der skal fejle.',
            submissionId: '22222222-2222-4222-8222-222222222222'
          };
          const failed = await onRequestPost(makeContext(failedPayload));
          assert.equal(failed.status, 502);
          assert.equal((await failed.json()).code, 'delivery_failed');
          assert.equal(graphSends, 2);

          console.log('contact backend contract: ok');
          NODE

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Verify email and fallback output
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! grep -q 'info@esbjergshine.dk' "$file"; then
              echo "Missing public email in $file"
              failed=1
            fi
          done < <(find dist -name '*.html' -print0)
          test "$failed" = "0"

          grep -q 'data-mail-fallback' dist/index.html
          grep -q 'data-submission-id' dist/index.html
          grep -q 'Formularen kræver JavaScript' dist/index.html
          grep -q '"email":"info@esbjergshine.dk"' dist/index.html
          grep -q 'CONTACT_MAILBOX.*info@esbjergshine.dk' wrangler.jsonc
          grep -q 'CONTACT_TO.*info@esbjergshine.dk' wrangler.jsonc

      - name: Wrangler dry run
        run: npm run cf:dry-run
