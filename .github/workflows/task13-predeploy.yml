name: Task 13 pre-deployment validation

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log
          ! grep -Eq 'npm warn (deprecated|install-scripts)' /tmp/npm-ci.log
      - name: Baseline checks
        run: |
          npm audit --audit-level=low
          npm run check
          npm run lint
          npm run format:check
          node --check public/site.js
          node --check public/site-hero.js
          node --check public/site-deferred.js
          node --check functions/api/contact.js
          node --check worker/index.js
      - name: API and security tests
        run: npm run test:unit
      - name: Build production site
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      - name: Static output tests
        run: npm run test:static
      - name: Cloudflare bundle
        run: npm run cf:dry-run
      - name: Worker runtime smoke
        run: npm run test:runtime
      - name: Start static Lighthouse server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/site.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/site.log
          exit 1
      - name: Representative Lighthouse audits
        run: |
          for route in / /ydelser/ /ydelser/polering/ /privatliv/; do
            name="$(echo "$route" | sed 's#^/$#home#; s#^/##; s#/$##; s#/#-#g')"
            npx --yes lighthouse@13.4.1 "http://127.0.0.1:4173$route" \
              --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path="lh-${name}.json"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = fs.readdirSync('.').filter((name) => name.startsWith('lh-') && name.endsWith('.json'));
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const scores = Object.fromEntries(['performance', 'accessibility', 'best-practices', 'seo'].map((name) => [name, report.categories[name]?.score ?? 0]));
            console.log(file, scores);
            if (scores.accessibility < 1 || scores['best-practices'] < 0.95 || scores.seo < 1) process.exitCode = 1;
          }
          NODE
