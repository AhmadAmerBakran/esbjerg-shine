name: Task 12 validate

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm-ci.log
          ! grep -Eq 'npm warn (deprecated|install-scripts)' /tmp/npm-ci.log
      - name: Validate project
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: |
          npm audit --audit-level=low
          npm run check
          npm run lint
          npm run format:check
          node --check public/site.js
          node --check public/site-hero.js
          node --check public/site-deferred.js
          node --check functions/api/contact.js
          node --check worker/index.js
          npm run build
          npm run cf:dry-run
          test -f dist/privatliv/index.html
          grep -q 'Cloudflare Turnstile' dist/privatliv/index.html
          grep -q 'Microsoft 365' dist/privatliv/index.html
          grep -q 'Google Maps' dist/privatliv/index.html
          grep -q '12 måneder' dist/privatliv/index.html
          grep -q 'Datatilsynet' dist/privatliv/index.html
          grep -q 'GDPR artikel 6' dist/privatliv/index.html
          ! grep -q 'planlagte behandling' dist/privatliv/index.html
          grep -q 'Jeg har læst, hvordan Esbjerg Shine behandler oplysningerne' dist/index.html
          grep -q 'ufravigelige rettigheder efter dansk ret' dist/ydelser/motorvask/index.html
          test -f docs/privacy-operations.md
