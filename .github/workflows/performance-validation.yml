name: Performance code validation

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit
        run: npm audit --audit-level=low

      - name: Astro check
        run: npm run check

      - name: JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/site-hero.js
          node --check public/site-deferred.js

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Verify performance changes
        run: |
          grep -q 'fetchpriority="high"' dist/index.html
          ! grep -q '@fontsource-variable/manrope' dist/index.html
          grep -q 'stale-while-revalidate=86400' dist/_headers

      - name: Wrangler dry run
        run: npm run cf:dry-run
