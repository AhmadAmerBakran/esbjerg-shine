name: SEO hardening validation

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit
        run: npm audit --audit-level=low

      - name: Astro check
        run: npm run check

      - name: JavaScript syntax
        run: |
          node --check functions/api/contact.js
          node --check worker/index.js
          node --check public/site.js
          node --check public/site-hero.js
          node --check public/site-deferred.js

      - name: Verify removed wording
        run: |
          old_one="$(printf 'lak%s' 'beskyttelse')"
          old_two="$(printf 'lak%s' 'forbedring')"
          old_three="$(printf 'lak %s' 'beskyttelse')"
          old_four="$(printf 'lak %s' 'forbedring')"
          if git grep -nIiE "${old_one}|${old_two}|${old_three}|${old_four}" -- . ':!package-lock.json'; then
            echo 'Removed service wording is still present.'
            exit 1
          fi

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Verify SEO output
        run: |
          grep -q 'rel="canonical" href="https://esbjergshine.dk/"' dist/index.html
          grep -q 'og:image:type' dist/index.html
          grep -q 'twitter:title' dist/index.html
          ! grep -q 'hreflang=' dist/index.html
          grep -q 'rel="canonical" href="https://esbjergshine.dk/ydelser/polering/"' dist/ydelser/polering/index.html
          grep -q '"@type":"Service"' dist/ydelser/polering/index.html
          grep -q '"@type":"BreadcrumbList"' dist/ydelser/polering/index.html
          grep -q '"@type":"ItemList"' dist/ydelser/index.html
          grep -q '<lastmod>2026-09-27</lastmod>' dist/sitemap.xml
          ! grep -q '/404/' dist/sitemap.xml
          grep -q 'noindex,nofollow' dist/404.html
          ! grep -q 'rel="canonical"' dist/404.html
          ! grep -q 'application/ld+json' dist/404.html
          grep -q 'Håndvask og udvendig bilpleje' dist/index.html
          grep -q '>Polering<' dist/ydelser/polering/index.html

      - name: Wrangler dry run
        run: npm run cf:dry-run
