name: Task 13 format tests

on:
  push:
    branches: [production-hardening]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: production-hardening
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Format tests
        run: npx prettier --write tests/*.mjs eslint.config.js package.json
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/*.mjs eslint.config.js package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format pre-deployment tests'
          git push origin HEAD:production-hardening
