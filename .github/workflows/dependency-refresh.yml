name: Dependency refresh

on:
  push:
    branches:
      - production-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Refresh dependencies and project metadata
        shell: bash
        run: |
          npm install --save-exact astro@7.3.5
          npm install --save-dev --save-exact @astrojs/check@0.9.10 typescript@6.0.3
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.scripts.check = 'astro check';
          pkg.engines = { ...(pkg.engines || {}), node: '>=24.21.0 <25' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          printf '24.21.0\n' > .node-version
          printf '24.21.0\n' > .nvmrc
          npm install --package-lock-only

      - name: Commit generated dependency files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .node-version .nvmrc
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update dependencies and pin Node 24'
            git push origin HEAD:production-hardening
          fi

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Astro check
        run: npm run check

      - name: Build
        run: npm run build
