name: Deploy Cloudflare production

on:
  workflow_run:
    workflows: ["Website quality gate"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: esbjerg-shine-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Verify dependency security
        run: npm audit --audit-level=low

      - name: Type check
        run: npm run check

      - name: Build production site
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Validate Cloudflare workers.dev bundle
        run: npm run cf:workers-dev:dry-run

      - name: Deploy validated commit to workers.dev
        run: npm run cf:workers-dev:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
