name: Media performance validation

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Baseline validation
        run: |
          npm audit --audit-level=low
          npm run check
          npm run lint
          npm run format:check
          node --check public/site-turnstile.js
      - name: Build production site
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      - name: Verify optimized output
        run: |
          grep -q 'type="image/avif"' dist/index.html
          grep -q 'hero-background-480w.avif' dist/index.html
          grep -q 'hero-background-768w.avif' dist/index.html
          grep -q 'site-turnstile.js' dist/index.html
          ! grep -q 'src="https://challenges.cloudflare.com/turnstile/v0/api.js"' dist/index.html
          grep -q 'fetchpriority="high"' dist/ydelser/polering/index.html
          grep -q 'polering/detail-768w.avif' dist/ydelser/polering/index.html
      - name: Regression tests
        run: npm run test:predeploy
      - name: Cloudflare dry-run
        run: npm run cf:dry-run
      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/site.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/site.log
          exit 1
      - name: Lighthouse mobile
        run: |
          for i in 1 2 3; do
            npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ \
              --quiet --chrome-flags="--headless --no-sandbox" \
              --output=json --output-path="lighthouse-mobile-${i}.json"
          done
      - name: Lighthouse service page
        run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ydelser/polering/ --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-polering.json
      - name: Lighthouse desktop
        run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-desktop.json
      - name: Report and enforce quality
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const mobile = [1, 2, 3].map((i) => ({ i, report: JSON.parse(fs.readFileSync(`lighthouse-mobile-${i}.json`, 'utf8')) }));
          const ranked = [...mobile].sort((a, b) => (a.report.categories.performance.score ?? 0) - (b.report.categories.performance.score ?? 0));
          const representative = ranked[1].report;
          const median = representative.categories.performance.score ?? 0;
          const polering = JSON.parse(fs.readFileSync('lighthouse-polering.json', 'utf8'));
          const desktop = JSON.parse(fs.readFileSync('lighthouse-desktop.json', 'utf8'));
          const print = (label, report) => {
            const categories = Object.fromEntries(['performance', 'accessibility', 'best-practices', 'seo'].map((name) => [name, report.categories[name]?.score ?? 0]));
            const fcp = report.audits['first-contentful-paint']?.displayValue;
            const lcp = report.audits['largest-contentful-paint']?.displayValue;
            const tbt = report.audits['total-blocking-time']?.displayValue;
            const bytes = report.audits['total-byte-weight']?.displayValue;
            console.log(label, categories, { fcp, lcp, tbt, bytes });
            if (categories.accessibility < 1 || categories['best-practices'] < .95 || categories.seo < 1) process.exitCode = 1;
          };
          mobile.forEach(({ i, report }) => print(`mobile-${i}`, report));
          print('polering', polering);
          print('desktop', desktop);
          console.log(`mobile performance median: ${Math.round(median * 100)}`);
          if (median < .95) process.exitCode = 1;
          NODE
