name: Media performance validation

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build production site
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build
      - name: Start local server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/site.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/site.log
          exit 1
      - name: Lighthouse diagnostic
        run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/ --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-home.json
      - name: Report LCP diagnostics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('lighthouse-home.json', 'utf8'));
          console.log('performance', report.categories.performance.score);
          for (const id of [
            'first-contentful-paint',
            'largest-contentful-paint',
            'speed-index',
            'total-blocking-time',
            'cumulative-layout-shift',
            'total-byte-weight',
            'largest-contentful-paint-element',
            'lcp-breakdown-insight',
            'lcp-discovery-insight',
            'render-blocking-insight',
            'network-requests',
            'resource-summary'
          ]) {
            const audit = report.audits[id];
            if (!audit) continue;
            console.log(`\n=== ${id} ===`);
            console.log('score:', audit.score, 'display:', audit.displayValue ?? '');
            if (audit.details) console.log(JSON.stringify(audit.details, null, 2).slice(0, 40000));
          }
          console.log('\nLCP audit ids:', Object.keys(report.audits).filter((id) => /lcp|largest-contentful/i.test(id)).join(', '));
          NODE
