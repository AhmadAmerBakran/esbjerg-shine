name: Temporary dependency refresh

on:
  push:
    branches:
      - fix/dependency-audit-2026-10-02
    paths:
      - .github/workflows/dependency-refresh-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/dependency-audit-2026-10-02

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Refresh vulnerable dependencies
        run: |
          npm install --save-dev --save-exact wrangler@4.147.0
          npm audit fix
          npm audit --audit-level=low
          npm ci --no-audit --no-fund

      - name: Remove temporary workflow and commit lockfile
        run: |
          rm .github/workflows/dependency-refresh-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-refresh-temp.yml
          git commit -m "Fix dependency audit vulnerabilities"
          git push origin HEAD:fix/dependency-audit-2026-10-02
