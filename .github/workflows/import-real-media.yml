name: Import natural service media

on:
  push:
    branches: [initial-build]
    paths:
      - '.media-import-manifest'

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: initial-build
          fetch-depth: 0

      - name: Download and prepare natural service photos
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            public/media/services/bilvask \
            public/media/services/komplet-klargoering \
            public/media/services/polering \
            public/media/services/motorvask

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          download() {
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 "$1" -o "$2"
          }

          download 'https://images.pexels.com/photos/33093191/pexels-photo-33093191.jpeg' "$tmp/bilvask-card.jpg"
          download 'https://images.pexels.com/photos/4665702/pexels-photo-4665702.jpeg' "$tmp/bilvask-detail.jpg"
          download 'https://images.pexels.com/photos/10240827/pexels-photo-10240827.jpeg' "$tmp/komplet-card.jpg"
          download 'https://images.pexels.com/photos/5288726/pexels-photo-5288726.jpeg' "$tmp/komplet-detail.jpg"
          download 'https://images.pexels.com/photos/12870109/pexels-photo-12870109.jpeg' "$tmp/polering-card.jpg"
          download 'https://images.pexels.com/photos/15169668/pexels-photo-15169668.jpeg' "$tmp/polering-detail.jpg"
          download 'https://images.pexels.com/photos/3689314/pexels-photo-3689314.jpeg' "$tmp/motorvask-card.jpg"
          download 'https://images.pexels.com/photos/24819303/pexels-photo-24819303.jpeg' "$tmp/motorvask-detail.jpg"

          python3 -m pip install --disable-pip-version-check --quiet pillow

          TMP_DIR="$tmp" python3 - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageOps

          tmp = Path(os.environ['TMP_DIR'])

          def prepare(source: Path, destination: Path, ratio: float, max_width: int, quality: int):
              image = ImageOps.exif_transpose(Image.open(source)).convert('RGB')
              width, height = image.size
              current_ratio = width / height

              if current_ratio > ratio:
                  crop_width = round(height * ratio)
                  left = (width - crop_width) // 2
                  image = image.crop((left, 0, left + crop_width, height))
              else:
                  crop_height = round(width / ratio)
                  top = (height - crop_height) // 2
                  image = image.crop((0, top, width, top + crop_height))

              if image.width > max_width:
                  target_height = round(image.height * max_width / image.width)
                  image = image.resize((max_width, target_height), Image.Resampling.LANCZOS)

              destination.parent.mkdir(parents=True, exist_ok=True)
              image.save(destination, 'WEBP', quality=quality, method=6)

          cards = [
              ('bilvask-card.jpg', 'public/media/services/bilvask/card.webp'),
              ('komplet-card.jpg', 'public/media/services/komplet-klargoering/card.webp'),
              ('polering-card.jpg', 'public/media/services/polering/card.webp'),
              ('motorvask-card.jpg', 'public/media/services/motorvask/card.webp'),
          ]
          details = [
              ('bilvask-detail.jpg', 'public/media/services/bilvask/detail.webp'),
              ('komplet-detail.jpg', 'public/media/services/komplet-klargoering/detail.webp'),
              ('polering-detail.jpg', 'public/media/services/polering/detail.webp'),
              ('motorvask-detail.jpg', 'public/media/services/motorvask/detail.webp'),
          ]

          for source, destination in cards:
              prepare(tmp / source, Path(destination), 8 / 5, 2560, 88)
          for source, destination in details:
              prepare(tmp / source, Path(destination), 16 / 9, 3840, 90)
          PY

      - name: Commit service media and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/media/services/bilvask/card.webp \
            public/media/services/bilvask/detail.webp \
            public/media/services/komplet-klargoering/card.webp \
            public/media/services/komplet-klargoering/detail.webp \
            public/media/services/polering/card.webp \
            public/media/services/polering/detail.webp \
            public/media/services/motorvask/card.webp \
            public/media/services/motorvask/detail.webp
          git rm .media-import-manifest .github/workflows/import-real-media.yml
          git commit -m "Replace service photos with natural real imagery"
          git push origin HEAD:initial-build
