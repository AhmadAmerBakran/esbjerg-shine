name: Accessibility validation

on:
  push:
    branches: [production-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit
        run: npm audit --audit-level=low

      - name: Astro check
        run: npm run check

      - name: JavaScript syntax
        run: |
          node --check public/site.js
          node --check public/site-deferred.js
          node --check public/site-hero.js
          node --check worker/index.js
          node --check functions/api/contact.js

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://esbjergshine.dk
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      - name: Verify accessibility semantics
        run: |
          grep -q 'class="skip-link"' dist/index.html
          grep -q 'aria-controls="hovednavigation"' dist/index.html
          grep -q 'aria-describedby="contact-form-help contact-form-status"' dist/index.html
          grep -q 'aria-valuetext="52 procent før og 48 procent efter"' dist/index.html
          grep -q 'aria-live="polite"' dist/index.html
          grep -Rqs 'prefers-reduced-motion:reduce' dist/_astro
          grep -q 'Siden findes' dist/404.html
          grep -q 'noindex,nofollow' dist/404.html

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/esbjerg-shine-http.log 2>&1 &
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/esbjerg-shine-http.log
          exit 1

      - name: Lighthouse accessibility
        run: |
          pages=(
            "http://127.0.0.1:4173/"
            "http://127.0.0.1:4173/ydelser/"
            "http://127.0.0.1:4173/ydelser/polering/"
            "http://127.0.0.1:4173/privatliv/"
            "http://127.0.0.1:4173/404.html"
          )
          index=0
          for page in "${pages[@]}"; do
            index=$((index + 1))
            npx --yes lighthouse@13.4.1 "$page" \
              --quiet \
              --only-categories=accessibility \
              --chrome-flags="--headless --no-sandbox" \
              --output=json \
              --output-path="a11y-${index}.json"
          done

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (let i = 1; i <= 5; i += 1) {
            const report = JSON.parse(fs.readFileSync(`a11y-${i}.json`, 'utf8'));
            const score = report.categories?.accessibility?.score ?? 0;
            console.log(`a11y-${i}: ${Math.round(score * 100)}`);
            if (score < 1) process.exitCode = 1;
          }
          NODE

      - name: Verify Worker custom 404
        run: |
          npx wrangler dev --local --port 8787 >/tmp/wrangler-a11y.log 2>&1 &
          for i in {1..30}; do
            if curl --silent http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 0.5
          done
          status="$(curl --silent --output /tmp/custom-404.html --write-out '%{http_code}' http://127.0.0.1:8787/denne-side-findes-ikke/)"
          test "$status" = "404"
          grep -q 'Siden findes' /tmp/custom-404.html
          grep -q 'Esbjerg Shine' /tmp/custom-404.html
